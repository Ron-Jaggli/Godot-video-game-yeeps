name: Build Quest APK and server

# Builds the Meta Quest APK and the Linux dedicated server on every push.
# Download them from the run's "Artifacts" section on the Actions tab.
# Run it by hand (Actions -> this workflow -> Run workflow) to bake a default
# server address into the APK.

on:
  push:
    branches: [main, claude/busy-bell-q2f7f5]
  workflow_dispatch:
    inputs:
      server_address:
        description: Default server address baked into the APK (e.g. 18.219.11.215). Empty keeps 127.0.0.1.
        required: false
        default: ""

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-36" "build-tools;36.1.0" "platform-tools" > /dev/null

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-v1

      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p ~/godot "$templates"
          cd ~/godot
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && rm godot.zip
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz "templates/version.txt" "templates/android_*" "templates/linux_*x86_64" -d "$templates"
          rm templates.tpz

      - name: Editor settings (Android SDK, JDK, signing key)
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/ci/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project
        # Builds the script class index. The editor can crash on exit after a
        # finished import (it pokes at adb), which is harmless.
        run: ~/godot/godot --headless --import || true

      - name: Install the Quest plugin
        run: ~/godot/godot --headless -s tools/setup_quest.gd

      - name: Bake server address
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.server_address != '' }}
        env:
          SERVER_ADDRESS: ${{ inputs.server_address }}
        run: |
          [[ "$SERVER_ADDRESS" =~ ^[A-Za-z0-9.:-]+$ ]] || { echo "Invalid address"; exit 1; }
          sed -i "s|^network/server_address=.*|network/server_address=\"$SERVER_ADDRESS\"|" project.godot
          grep server_address project.godot

      - name: Export Quest APK
        run: |
          mkdir -p builds/quest
          ~/godot/godot --headless --install-android-build-template --export-debug "Meta Quest" builds/quest/grimlings.apk
          test -f builds/quest/grimlings.apk

      - name: Export Linux server
        run: |
          mkdir -p builds/server
          ~/godot/godot --headless --export-release "Dedicated Server (Linux)" builds/server/grimlings-server.x86_64
          test -f builds/server/grimlings-server.x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: quest-apk
          path: builds/quest/grimlings.apk

      - uses: actions/upload-artifact@v4
        with:
          name: linux-server
          path: builds/server/
